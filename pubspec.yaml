name: atlas_music
description: Open-source music player with YouTube integration.
publish_to: 'none'
version: 2.2.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  youtube_explode_dart: 3.1.0
  http: ^1.2.0
  cached_network_image: ^3.3.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  audio_service: ^0.18.18
  connectivity_plus: ^7.3.1
  shazam_identifier: ^1.0.0
  # Used directly by the identify flow (shazam_identifier pulls it in anyway).
  record: ^7.1.2
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.1

dependency_overrides:
  audio_service:
    path: plugins/audio_service

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Test-only: a real QR decoder so the tests prove the generated code (and
  # the shared image) is actually scannable, not just a picture of a grid.
  zxing2: ^0.2.4

flutter:
  uses-material-design: true
